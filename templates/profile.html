{% extends "base.html" %}

{% block title %}Doctor Profile{% endblock %}

{% block page_heading %}Doctor Profile{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>
                <i class="fa-solid fa-user-doctor"></i>
                Doctor Profile
            </h3>

        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                <!-- Profile Photo -->

                <div class="text-center mb-4">

                    <img
                        src="{{ url_for('static', filename='images/' + doctor['profile_image']) }}"
                        width="140"
                        height="140"
                        style="border-radius:50%; object-fit:cover;">

                    <br><br>

                    <input
                        type="file"
                        name="profile_image"
                        class="form-control">

                </div>

                <hr>

                <!-- Doctor Name -->

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="fullname"
                        class="form-control"
                        value="{{ doctor['fullname'] }}"
                        required>

                </div>

                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ doctor['email'] }}"
                        required>

                </div>

                <hr>

                <h5>Change Password</h5>

                <div class="mb-3">

                    <label>
                        Current Password
                    </label>

                    <input
                        type="password"
                        name="current_password"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label>
                        New Password
                    </label>

                    <input
                        type="password"
                        name="new_password"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control">

                </div>

                <button
                    class="btn btn-primary">

                    Save Changes

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
